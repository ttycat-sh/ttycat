name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # the daemon: its tables, and its tools
      - name: Screens can be previewed with no board
        run: python3 tools/preview/preview.py preview.png --scene asks --goto queue && test -s preview.png
      - name: The shared firmware knows no particular board
        run: "! grep -rniE 'waveshare|esp_lcd|esp32c5|driver/i2c|driver/spi|EXIO_' main --include='*.c' --include='*.h' --include='CMakeLists.txt' --exclude=fonts.c"
      - name: Taps answer only the prompt on screen, and the colours are the daemon's
        run: python3 -m unittest discover -s tools/tests
      - name: Nothing on a board's screen is hidden by its glass
        run: |
          for folder in boards/*/; do
            board=$(basename "$folder")
            [ "$board" = template ] && continue
            hidden=$(python3 tools/preview/gallery.py "$RUNNER_TEMP/$board.png" --board "$board" 2>&1 >/dev/null)
            echo "$board: ${hidden:-square corners}"
            case "$hidden" in "" | *": nothing") ;; *) exit 1 ;; esac
          done

  build:
    runs-on: ubuntu-latest
    # Every folder in boards/: a change to the shared code mustn't break any of them.
    strategy:
      fail-fast: false
      matrix:
        board: [waveshare-esp32-c5-touch-lcd-2-8, waveshare-esp32-s3-touch-amoled-2-16, template]
    # The same ESP-IDF 5.5.6 as a release, pinned by digest.
    container: docker.io/espressif/idf@sha256:851f136a2c09cf17c13e952b9975606d7d1050be1480b1fd82c7ea4bce78cfb3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The firmware for ${{ matrix.board }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -B "build-${{ matrix.board }}" -D BOARD=${{ matrix.board }} build
